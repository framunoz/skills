# Minimal kedro-mlflow config. Generated by `kedro mlflow init`; lives in conf/local/.
# Targets kedro-mlflow >= 1.0.0 (Kedro 1.0+). Confirm version pins at install time.

server:
  mlflow_tracking_uri: mlruns      # null -> mlflow.get_tracking_uri(); local path or http://host:5000
  mlflow_registry_uri: null        # null -> falls back to mlflow_tracking_uri
  credentials: null                # null -> or a key into credentials.yml
  request_header_provider:
    type: null
    pass_context: false
    init_kwargs: {}

tracking:
  disable_tracking:
    pipelines: []                  # pipeline names to exclude from tracking
    disable_autologging: true
  experiment:
    name: my_project               # defaults to {{ python_package }} via Jinja
    create: true
  run:
    id: null                       # null -> plugin opens/closes the run automatically
    name: null
    nested: true
  params:
    dict_params:
      flatten: false
      recursive: true
      sep: "."
    long_params_strategy: fail     # fail | tag | truncate (when a param exceeds MLflow's length limit)

ui:
  port: "5000"
  host: "127.0.0.1"
