# kedro-mlflow 2.x datasets (Kedro 1.7, MLflow 3.x). Every entry was saved/loaded in a real run.
# Put in conf/base/catalog_mlflow.yml; requires `uv add kedro-mlflow` and a database tracking URI
# (server.mlflow_tracking_uri: sqlite:///mlflow.db in conf/local/mlflow.yml).

# Artifact: the wrapped dataset is saved normally AND its file logged to the active run
wave_plot:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: matplotlib.MatplotlibDataset          # MatplotlibWriter no longer exists
    filepath: data/08_reporting/wave_plot.png
  # artifact_path: plots                        # optional subfolder in the run's artifacts

# Metrics: node returns {"r2": {"value": 0.91, "step": 0}, "rmse": {"value": 0.3, "step": 0}}
# logged as wave_metrics.r2, wave_metrics.rmse
wave_metrics:
  type: kedro_mlflow.io.metrics.MlflowMetricsHistoryDataset

# Model: logged with its flavor as an MLflow 3 "logged model"
wave_model:
  type: kedro_mlflow.io.models.MlflowModelTrackingDataset
  flavor: mlflow.sklearn
  save_args:
    name: wave_model                            # MLflow 3 / kedro-mlflow 2: was artifact_path

# Registry: LOAD a registered model by alias (or stage_or_version — never both)
wave_model_champion:
  type: kedro_mlflow.io.models.MlflowModelRegistryDataset
  model_name: wave_model
  alias: champion
  flavor: mlflow.sklearn                        # omit -> PyFuncModel
