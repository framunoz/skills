# Persistence options (versioned, filepath, fs_args, load/save_args) and MemoryDataset's
# copy_mode belong to different dataset types — never combine them in one entry.

# A: persisted, versioned model on S3-compatible storage (needs s3fs)
advanced_versioned_cloud_model:
  type: pickle.PickleDataset
  filepath: s3://my-bucket/models/advanced_rf.pkl
  backend: joblib
  versioned: true               # one timestamped folder per save
  credentials: model_store      # conf/local/credentials.yml: {key: ..., secret: ...}
  fs_args:                      # passed to the fsspec filesystem
    client_kwargs:
      endpoint_url: "https://s3.custom-provider.com"
  metadata:
    kedro-viz:
      layer: models

# B: huge in-memory hand-off between nodes without copying.
# Unset copy_mode is inferred: pandas/numpy -> copy, polars/Spark/Ibis -> assign, else deepcopy.
# assign shares the object: downstream nodes must not mutate it.
huge_intermediate_object:
  type: MemoryDataset
  copy_mode: assign
